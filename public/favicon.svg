<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#86EFAC" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Ech Buri Frog Mascot Character -->
  <g filter="url(#shadow)">
    <!-- Eye Bumps (Outer Green) -->
    <circle cx="21" cy="22" r="10" fill="#166534"/>
    <circle cx="43" cy="22" r="10" fill="#166534"/>
    <circle cx="21" cy="22" r="9" fill="#22C55E"/>
    <circle cx="43" cy="22" r="9" fill="#22C55E"/>

    <!-- Head / Face Body -->
    <path d="M 12 33 C 11 44 18 53 32 53 C 46 53 53 44 52 33 C 51 27 46 25 42 27 C 37 29 27 29 22 27 C 18 25 13 27 12 33 Z" fill="#22C55E"/>
    
    <!-- Face Shadow / Depth Base -->
    <path d="M 16 43 C 20 49 26 51 32 51 C 38 51 44 49 48 43 C 44 48 38 50 32 50 C 26 50 20 48 16 43 Z" fill="#15803D" opacity="0.4"/>

    <!-- Eye Whites -->
    <circle cx="21" cy="22" r="6.5" fill="#FFFFFF"/>
    <circle cx="43" cy="22" r="6.5" fill="#FFFFFF"/>

    <!-- Eye Pupils (Dark Ink) -->
    <circle cx="21.5" cy="22" r="3.2" fill="#052E16"/>
    <circle cx="42.5" cy="22" r="3.2" fill="#052E16"/>

    <!-- Eye Catchlight Highlights -->
    <circle cx="20" cy="20.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="41" cy="20.5" r="1.3" fill="#FFFFFF"/>

    <!-- Cheerful Smile -->
    <path d="M 25 39 Q 32 46 39 39" fill="none" stroke="#052E16" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="17" cy="40" rx="2.5" ry="1.4" fill="#F97316" opacity="0.45"/>
    <ellipse cx="47" cy="40" rx="2.5" ry="1.4" fill="#F97316" opacity="0.45"/>
  </g>
</svg>