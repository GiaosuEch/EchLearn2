# ==================================================================
#  RAVENHUB — LOCAL CONTAINER ORCHESTRATION
#  Full stack: licensing server + PostgreSQL (12GB-less, no KYC).
#  For production free-tier hosting, swap `db` for Supabase/Neon
#  and deploy the server alone on Render/Railway.
# ==================================================================
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ravenhub:ravenhub@db:5432/ravenhub
      PORT: "3000"
      # CYPHER_MASTER_KEY: "replace-with-a-long-random-automation-key"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ravenhub
      POSTGRES_PASSWORD: ravenhub
      POSTGRES_DB: ravenhub
    volumes:
      - ravenhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravenhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ravenhub_pgdata:
